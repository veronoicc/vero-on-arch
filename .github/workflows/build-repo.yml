name: Build and Update Repository

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 03:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [plugins_update, repo_update]

permissions:
  contents: write

jobs:
  build:
    name: Build vero-on-arch
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap container and dependencies
        run: |
          pacman -Syu --noconfirm git sudo devtools namcap nvchecker github-cli pacman-contrib

          # Create non-root builder user
          id -u builder &>/dev/null || useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure permissions and git
        run: |
          mkdir -p /github/home
          chown -R builder:builder "$GITHUB_WORKSPACE" /github/home /home/builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Install AUR helper
        run: |
          sudo -u builder bash -c '
            set -euo pipefail
            export HOME=/home/builder
            cd /tmp
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm
            cd /tmp
            rm -rf yay-bin
          '
          # Alias paru to yay for pacman 7 / libalpm 16 compatibility
          if ! command -v paru >/dev/null 2>&1; then
            ln -sf /usr/bin/yay /usr/local/bin/paru
          fi

      - name: Auto-update package versions
        run: |
          sudo -u builder -E bash -c '
            set -euo pipefail
            export HOME=/home/builder
            ./scripts/update-packages.sh --commit
          '

      - name: Build packages and publish repository
        run: |
          sudo -u builder -E bash -c '
            set -euo pipefail
            export HOME=/home/builder
            ./scripts/build-repo.sh --publish
          '
