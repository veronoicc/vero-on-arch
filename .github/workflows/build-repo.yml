name: Build and Update Repository

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'runner/**'
      - '.github/workflows/docker.yml'
      - 'README.md'
      - '.gitignore'
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build vero-on-arch
    runs-on: [self-hosted, linux, x64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clean environment and fix permissions
        run: |
          sudo chown -R builder:builder "$HOME" "${GITHUB_WORKSPACE:-/home/builder/actions-runner/_work}" 2>/dev/null || true
          mkdir -p "$HOME/.cache"
          chmod -R u+rwX "$HOME/.cache" 2>/dev/null || true
          rm -rf "${GITHUB_WORKSPACE:-.}/dist"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare build environment
        run: |
          sudo chown -R builder:builder "$HOME" "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cache"
          chmod -R u+rwX "$HOME/.cache"
          rm -rf "$GITHUB_WORKSPACE/dist"

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Auto-update package versions
        run: ./scripts/update-packages.sh --commit

      - name: Build packages and publish repository
        run: ./scripts/build-repo.sh --publish
      - name: Cleanup runner environment
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/dist"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type d \( -name "src" -o -name "pkg" \) -exec rm -rf {} + 2>/dev/null || true
          sudo chown -R builder:builder "$HOME" "$GITHUB_WORKSPACE" 2>/dev/null || true
